name: CI/CD

on:
  # Executa em todos os pushes e PRs para garantir que os testes sempre rodem
  push:
    branches: [ "pluga-desaafio-paulo" ]
  pull_request:
    branches: [ "pluga-desaafio-paulo" ]

jobs:
  # --- Fase de Testes ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Instala dependências
        run: npm ci

      - name: Executa testes
        run: npm test

  # --- Fase de Deploy (executa somente na branch main e após os testes) ---
  deploy:
    needs: test
    if: github.ref == 'refs/heads/pluga-desaafio-paulo'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Instala dependências
        run: npm ci

      - name: Build do projeto (Next.js)
        run: npm run build

      - name: Deploy para a Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel --prod --confirm --token "$VERCEL_TOKEN"
